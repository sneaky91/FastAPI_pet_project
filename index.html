<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Chat</title>
  <style>
    :root{--bg:#0b1020;--panel:#131b30;--line:#293858;--text:#eef3ff;--muted:#91a0bd;--accent:#7c8cff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 75% 0,#25366c,transparent 35%),var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}button,textarea{font:inherit}button{color:inherit;cursor:pointer}.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100vh}.side{display:flex;flex-direction:column;min-height:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#090e1ddd}.brand{display:flex;align-items:center;gap:11px;margin:0 9px 27px;font-size:18px;font-weight:750}.logo{display:grid;width:35px;height:35px;place-items:center;border-radius:11px;background:linear-gradient(135deg,#7c8cff,#9b7cff)}.new{width:100%;padding:11px;border:1px solid #6575d8;border-radius:11px;background:#6879e522;font-weight:650}.caption{margin:24px 9px 8px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.history{display:flex;flex:1;flex-direction:column;min-height:0;overflow:hidden}.history-list{min-height:0;overflow-y:auto;padding:0 2px}.history-row{display:flex;align-items:center;gap:3px;margin:2px 0}.history-item{display:block;flex:1;min-width:0;margin:0;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:#c5d0e8;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item:hover,.history-item.active{background:#ffffff12;color:#fff}.delete-chat{display:grid;flex:0 0 30px;width:30px;height:30px;place-items:center;padding:6px;border:0;border-radius:8px;background:transparent;opacity:.55}.delete-chat:hover{background:#ff71811c;opacity:1}.delete-chat img{width:16px;height:16px}.empty{padding:6px 9px;color:#65738f;font-size:12px}.tips{margin:0 9px;color:var(--muted);font-size:13px}.tips p{margin:0 0 10px}.side-bottom{flex:0 0 auto}.status{display:flex;align-items:center;gap:8px;margin:18px 9px 12px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#36d399}.dot.off{background:#ff7181}.clear{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent}main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding:18px 5%;border-bottom:1px solid #29385888}.head h1{margin:0;font-size:21px}.head p{margin:3px 0 0;color:var(--muted);font-size:13px}.badge{padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px}.chat{width:min(900px,100%);flex:1;min-height:0;margin:0 auto;padding:30px 5% 20px;overflow-y:auto;scroll-behavior:smooth}.welcome{text-align:center;padding:35px 20px}.star{display:inline-grid;width:56px;height:56px;place-items:center;margin-bottom:14px;border-radius:17px;background:#7c8cff1c;font-size:26px}.welcome h2{margin:0 0 8px;font-size:26px}.welcome p{max-width:430px;margin:auto;color:var(--muted)}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:650px;margin:25px auto}.suggestion{padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#ffffff05;text-align:left}.message{display:flex;gap:12px;margin-bottom:24px}.message.user{flex-direction:row-reverse}.avatar{display:grid;flex:0 0 34px;height:34px;place-items:center;border-radius:11px;background:#202c4b;color:#aab6ff;font-size:12px;font-weight:700}.user .avatar{background:linear-gradient(135deg,#4858b9,#895dbe);color:#fff}.message-body{min-width:0}.meta{margin:0 4px 4px;color:var(--muted);font-size:11px}.user .meta{text-align:right}.bubble{max-width:min(720px,calc(100vw - 360px));padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{border-color:#5c68c1;background:#4a58b933}.typing{display:flex;gap:5px;min-width:55px}.typing i{width:6px;height:6px;border-radius:50%;background:#9aa9df;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{transform:scale(.65);opacity:.5}40%{transform:scale(1);opacity:1}}.composer-wrap{width:min(900px,100%);flex:0 0 auto;margin:0 auto;padding:0 5% 20px}.composer{display:flex;align-items:flex-end;gap:9px;padding:9px;border:1px solid #3b4b72;border-radius:16px;background:#11182bcc;box-shadow:0 12px 45px #0003}textarea{flex:1;min-height:25px;max-height:160px;resize:none;padding:8px;border:0;outline:0;background:transparent;color:var(--text)}textarea::placeholder{color:#71809e}.send{display:grid;width:40px;height:40px;place-items:center;border:0;border-radius:11px;background:linear-gradient(135deg,#7c8cff,#9b7cff);font-size:18px}.send:disabled{opacity:.45}.hint{margin:7px;color:#64728d;font-size:11px;text-align:center}@media(max-width:700px){html,body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.side{display:none}main{height:100vh}.badge{display:none}header{padding:17px 20px}.chat{padding:20px}.suggestions{grid-template-columns:1fr}.bubble{max-width:calc(100vw - 95px)}.composer-wrap{padding:0 20px 20px}}
  </style>
</head>
<body>
  <div class="app"><aside class="side"><div class="brand"><span class="logo">✦</span>Gemini Chat</div><button class="new" id="newChat">＋ New chat</button><div class="caption">History</div><div class="history"><div class="history-list" id="historyList"></div></div><div class="caption">Tips</div><div class="tips"><p>Write in English or any language.</p><p>Press Enter to send.</p><p>Use Shift + Enter for a new line.</p></div><div class="side-bottom"><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking API...</span></div><button class="clear" id="clearChat">Clear current chat</button></div></aside><main><header><div class="head"><h1>Your AI assistant</h1><p>Powered by your local FastAPI server</p></div><span class="badge">localhost:8000</span></header><section class="chat" id="chat"></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="Write a message..." autocomplete="off"></textarea><button class="send" id="send" type="submit">➤</button></form><div class="hint">Gemini API · Requests are stored on the server</div></div></main></div>
  <script src="app.js"></script>
</body>
</html>
